<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/title.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <meta name="description" content="CivicPulse AI is a community complaint resolution system empowering citizens and authorities to solve local issues." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <title>CivicPulse - Community Complaint Resolution System</title>
    <!-- PWA Fail-safe: Unregister SW on fatal errors -->
    <script>
      window.addEventListener('error', function(e) {
        if (navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
